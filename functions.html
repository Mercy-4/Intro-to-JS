function add(a, b) {

}
alert(multiply(53, 98))


//arrow functions
const areaCircle = (r) => 22/7 * r**2

alert(areaCircle(8))

let scores = [56,89,90,32,58,76,61,47,87,12]
let newScores= scores.map((score)=>score+2) //map function is used to modify contents inside your array

function addByTwo(value){
    return value+2
}
console.log(scores.map(addByTwo))


const addByThree = (a) => a+ 3
