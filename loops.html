<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loops</title>
</head>
<body>

<script>
    //for loop
    for (let i = 0; i < 100; i++) {
        console.log(`Hello ${i}`);
    }    for (let i = 0; i < 100; i+=10) {
        console.log(`Hello ${i}`);
    }

    let scores = [67, 90, 24, 81, 58, 62, 43]
    for (let i = 0; i < scores.length; i++) {
        let s = scores[i];
        console.log(s)
    }

    //while loop
    let x = -10
    while (x <= 100) {
        console.log(x**2)
        x++
    }
     //breaking a loop to stop from running once it  gets to a certain point
      let y = -10
    while (y <= 100) {
        console.log(y**2)
        if(y**2 === 0){
            break
        }
        y++
    }

    let z = 0
    do{
        console.log(z)
        z++
    }
    while (z<20)

</script>
</body>
</html>
