    function divide(a, b, rounded=false){
        let res = a/b
        if(rounded===true){
            return Math.round(res)
        }
        return res
    }
    let res1= divide(100, 4, true) //answer will be rounded off because the 3rd parameter is provided
    let res2 = divide(100, 3) //answer is not rounded since 3rd parameter is not provided and the default value is False

    console.log(res1, res2)

    //a function that can add any amount of parameters using a spread operator
    function flexibleAdd(...nums){
        let total = 0
        for(let value of nums){
            total += value
        }
        return total
    }
    console.log(flexibleAdd(10, 90, 67, 567, 27654, 654))
